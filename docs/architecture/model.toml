# The engine's context and containers, as one model.
#
# Each element has an `id` that stays fixed when its name changes, a one-line
# `role`, and the place in `docs/architecture/` that specifies it: `doc` names
# the file, `section` its heading, and `bullet` the bold opening of the bullet
# where a section holds several elements, matched with the doc's line breaks
# read as spaces. The Mermaid views are generated from this file and never
# edited by hand.
#
# `section` and `bullet` are left out where the file documents one element
# alone.
#
# `kind` is one of: person; system, outside the engine; container, inside the
# engine and deployed or run on its own; library, inside the engine and built
# into the containers that import it; component, a part of one container,
# named by its `container`. A relation runs from the element that acts to the
# element it acts on. Its `access` is `reads` where the relation leaves its
# target unchanged, and `writes` where it changes state in or through the
# target, starting a run included. A view draws a read dashed.
#
# `code` on a container names the Python modules its process runs first. The
# package graph in `modules.md` groups each package of `src/climb` by the
# containers whose `code` reaches it through imports. The sandbox runs
# `climb.runner.child` as a script, so the package above it never runs there.
# A container's `code` is imported by nothing outside its own package, by an
# import contract generated into `pyproject.toml`.
#
# `runs` on a container names every package its `code` reaches, kept by hand.
# The module-graph check fails where `runs` and the reach differ, so a new
# import that brings a package into another container fails the commit.
#
# `tables` on an element names the tables it owns: those whose record its doc
# specifies. The schema graph in `database/schema.md` draws each table in its
# owner's box, and its check fails on a table with no owner or with two.
#
# `src` on an element names the source files it owns, as globs relative to the
# repository root. Every file under `src/climb` and `packages/core/src` has
# exactly one owner, and the model-views check fails on a file with none or
# with two, and on a glob matching no file. A component owns the files its doc
# specifies, and each record's schema file goes to the component owning its
# table. A container owns a file spanning several of its components, such as a
# module of routes. `database` owns the base every package may import and the
# table files declaring several components' tables. A diff then maps to the
# elements it changed.
#
# A flow is a named, ordered list of steps, with the page that describes it.
# Each step names the `from` and the `to` of one relation, and is drawn with
# that relation's label, as a sequence diagram in that page.

[engine]
id = "engine"
name = "Climbance"
role = "Serves generated problems, judges each submission against the problem's own cases, and schedules what to practise next."
doc = "README.md"
section = "Shape"

# People

[[element]]
id = "learner"
kind = "person"
name = "Learner"
role = "Solves problems, recalls templates and answers questions, on the web or the phone."
doc = "README.md"
section = "Shape"
bullet = "The engine is a learning platform, not a competitive one."

[[element]]
id = "author"
kind = "person"
name = "Author"
role = "Generates and reviews the corpus, authors the content, invites users and deploys the engine."
doc = "cli/README.md"
section = "Generation is a command"

# Systems outside the engine

[[element]]
id = "identity-providers"
kind = "system"
name = "Google and GitHub"
role = "Hold each identity and its login; the engine stores no password."
doc = "api/sign-in.md"
section = "Providers and identities"

[[element]]
id = "model-router"
kind = "system"
name = "Model router"
role = "Reaches every model as chat completions, each request pinned to one endpoint."
doc = "cli/calls.md"
section = "The transport"
bullet = "One transport, one shape."

[[element]]
id = "content-repo"
kind = "system"
name = "Content repository"
role = "The private repository of authored cards and modules under `content/`, seeded into the store."
doc = "content-repo/README.md"

[[element]]
id = "image-registry"
kind = "system"
name = "Image registry"
role = "Holds the engine's image, built on each push to main and pulled by digest."
doc = "concepts/deployment.md"
section = "Deploying an image"
bullet = "A push to main builds the image"

[[element]]
id = "offsite-dumps"
kind = "system"
name = "Off-server dump storage"
role = "Keeps the scheduled database dumps away from the storage the database lives on."
doc = "concepts/deployment.md"
section = "The server"
bullet = "The database is dumped on a schedule"

# Containers of the engine

[[element]]
id = "web-app"
kind = "container"
name = "Web app"
role = "Vite, React and TypeScript, built to static files; the pages a learner uses in a browser."
doc = "web-app/README.md"

[[element]]
id = "native-app"
kind = "container"
name = "Native app"
role = "The phone client for Android and iOS; schedules the knowledge queues offline and syncs."
doc = "native-app/README.md"

[[element]]
id = "core-package"
kind = "library"
name = "Shared core"
role = "`packages/core`: the knowledge module's rules, each screen's labels and acts, and each technique's knowledge reading from the device's copy of the log, imported by both clients."
doc = "core-package/README.md"
src = ["packages/core/src/**"]

[[element]]
id = "shared-editor"
kind = "library"
name = "Shared editor"
role = "`packages/editor`: the CodeMirror setup for editing Python, imported by both clients."
doc = "shared-editor/README.md"

[[element]]
id = "proxy"
kind = "container"
name = "Caddy"
role = "Terminates TLS, keeps the certificates on a volume, and passes every request to the API."
doc = "proxy/README.md"

[[element]]
id = "api"
kind = "container"
name = "API"
role = "Python and FastAPI: answers JSON under `/api`, serves the web app's files, signs users in and records the log."
doc = "api/README.md"
src = [
    "src/climb/api/__init__.py",
    "src/climb/api/__main__.py",
    "src/climb/api/app.py",
    "src/climb/api/context.py",
    "src/climb/api/pages.py",
    "src/climb/api/reads.py",
    "src/climb/api/writes.py",
    "src/climb/api/knowledge.py",
]
code = ["climb.api", "climb.api.__main__"]
runs = [
    "climb.api", "climb.attempt_claims", "climb.board", "climb.calls", "climb.caps",
    "climb.cards", "climb.cases", "climb.classifier", "climb.feedback",
    "climb.graduation", "climb.ids", "climb.judgements", "climb.judging",
    "climb.keylines", "climb.knowledge", "climb.ladder", "climb.log", "climb.matches",
    "climb.mint", "climb.mutation", "climb.pick", "climb.problems", "climb.ratings",
    "climb.recall", "climb.retirement", "climb.runner", "climb.runs", "climb.schema", "climb.scorer",
    "climb.sitting", "climb.solution_claims", "climb.solutions", "climb.standing",
    "climb.storage", "climb.techniques", "climb.template_schedule",
]

[[element]]
id = "broker"
kind = "container"
name = "Broker"
role = "Holds the container runtime's socket, admits one submission at a time and starts its sandbox."
doc = "broker/README.md"
src = ["src/climb/broker/**"]
code = ["climb.broker", "climb.broker.__main__"]
runs = [
    "climb.broker",
]

[[element]]
id = "sandbox"
kind = "container"
name = "Sandbox"
role = "One container per run under gVisor, no network, read-only root; its entry process forks a child per case."
doc = "sandbox/README.md"
src = [
    "src/climb/runner/child.py",
    "src/climb/runner/encoding.py",
]
code = ["climb.runner.child"]
runs = [
    "climb.runner",
]

[[element]]
id = "database"
kind = "container"
name = "Postgres"
role = "The one store: the corpus, the content, every user's log and the call log."
doc = "database/README.md"
src = [
    "src/climb/__init__.py",
    "src/climb/ids.py",
    "src/climb/mint.py",
    "src/climb/standing.py",
    "src/climb/storage.py",
    "src/climb/schema/__init__.py",
    "src/climb/schema/record.py",
    "src/climb/log/__init__.py",
    "src/climb/log/table.py",
    "src/climb/knowledge/__init__.py",
    "src/climb/knowledge/table.py",
]

[[element]]
id = "cli"
kind = "container"
name = "Command line"
role = "`climb`, run by the author off the server: generation, the by-hand passes, seeding, invitations and difficulty fits; it runs each draft's solutions in a local subprocess, never through the broker."
doc = "cli/README.md"
src = [
    "src/climb/cli/__init__.py",
    "src/climb/cli/__main__.py",
    "src/climb/cli/display.py",
    "src/climb/cli/flags.py",
    "src/climb/cli/prompts.py",
    "src/climb/cli/rows.py",
    "src/climb/cli/problem.py",
    "src/climb/cli/user_log.py",
]
code = ["climb.cli"]
runs = [
    "climb.attempt_claims", "climb.board", "climb.calls", "climb.caps", "climb.cards",
    "climb.cases", "climb.classifier", "climb.cli", "climb.diagnoser",
    "climb.diagnosing", "climb.difficulty", "climb.drafts", "climb.generation",
    "climb.ids", "climb.judgements", "climb.judging", "climb.keylines",
    "climb.knowledge", "climb.log", "climb.matches", "climb.mint",
    "climb.mutant_diagnoses", "climb.mutation", "climb.outcomes", "climb.problems",
    "climb.ratings", "climb.runner", "climb.runs", "climb.schema", "climb.scorer", "climb.sitting",
    "climb.solution_claims", "climb.solutions", "climb.standing", "climb.storage",
    "climb.techniques", "climb.trials", "climb.verifications",
]

# Components of the API: the core loop, from an attempt arriving to the next
# item scheduled

[[element]]
id = "sitting"
kind = "component"
container = "api"
name = "Sitting"
role = "Times one session on one problem, minted at the first clock press or submission, and ended where next read."
doc = "api/sitting.md"
src = [
    "src/climb/sitting.py",
    "src/climb/log/sittings.py",
    "src/climb/schema/sitting.py",
]
tables = [
    "sitting_pauses", "sittings",
]

[[element]]
id = "submission"
kind = "component"
container = "api"
name = "Submission"
role = "Takes a user's code for a problem, refuses it past the run caps, and mints the attempt carrying the result."
doc = "api/submission.md"
src = ["src/climb/caps.py"]

[[element]]
id = "runner"
kind = "component"
container = "api"
name = "Runner"
role = "Runs code against a problem's cases, through the broker or the local subprocess, and reads each case's outcome."
doc = "api/runner.md"
src = [
    "src/climb/runner/__init__.py",
    "src/climb/runner/execution.py",
    "src/climb/runner/outputs.py",
    "src/climb/runner/remote.py",
    "src/climb/runner/verdicts.py",
]

[[element]]
id = "run-faults"
kind = "component"
container = "api"
name = "Run faults"
role = "Stores a run the sandbox answered no result for, so the run caps count it."
doc = "api/run-faults.md"
src = [
    "src/climb/log/run_faults.py",
    "src/climb/schema/run_fault.py",
]
tables = [
    "run_faults",
]

[[element]]
id = "attempt-log"
kind = "component"
container = "api"
name = "Attempt log"
role = "Appends each attempt and its attempt verification; private to the user."
doc = "api/attempt-log.md"
src = [
    "src/climb/log/store.py",
    "src/climb/log/latest.py",
    "src/climb/schema/attempt.py",
    "src/climb/schema/verification.py",
]
tables = [
    "attempt_verification_case_results", "attempt_verifications", "attempts",
]

[[element]]
id = "attempt-claims"
kind = "component"
container = "api"
name = "Attempt claims"
role = "Stores which techniques an attempt's code used, the user's claim standing over the classifier's."
doc = "api/attempt-claims.md"
src = [
    "src/climb/attempt_claims/__init__.py",
    "src/climb/attempt_claims/attribution.py",
    "src/climb/attempt_claims/hand.py",
    "src/climb/attempt_claims/sample.py",
    "src/climb/attempt_claims/revision.py",
    "src/climb/cli/claim.py",
]
tables = [
    "attempt_claims",
]

[[element]]
id = "self-labels"
kind = "component"
container = "api"
name = "Self-labels"
role = "Stores the user's verdict on why an attempt went the way it did, as a failure mode."
doc = "api/self-labels.md"
tables = [
    "self_labels",
]

[[element]]
id = "template-schedule"
kind = "component"
container = "api"
name = "Template schedule"
role = "Replays each template's FSRS state from its reviews: recall attempts and sittings on problems written for it."
doc = "api/template-schedule.md"
src = ["src/climb/template_schedule.py"]

[[element]]
id = "card-states"
kind = "component"
container = "api"
name = "Card states"
role = "Derives each card's state, from not started to graduated or lapsed, from the log on every read."
doc = "api/card-states.md"
src = [
    "src/climb/graduation.py",
    "src/climb/ladder.py",
]

[[element]]
id = "mastery"
kind = "component"
container = "api"
name = "Mastery"
role = "Computes each technique's recognition and execution from the log on every read."
doc = "api/mastery.md"
src = [
    "src/climb/board/__init__.py",
    "src/climb/board/execution.py",
    "src/climb/board/judged.py",
    "src/climb/board/view.py",
    "src/climb/cli/board.py",
]

[[element]]
id = "pick"
kind = "component"
container = "api"
name = "Pick"
role = "Names the next item: a template and the act that reviews it, read from the three folds."
doc = "api/pick.md"
src = [
    "src/climb/pick.py",
    "src/climb/api/picks.py",
    "src/climb/board/candidates.py",
]

[[element]]
id = "predictions"
kind = "component"
container = "api"
name = "Predictions"
role = "Stores what each pick expected, from FSRS and from mastery, before the user acts on it."
doc = "api/predictions.md"
src = [
    "src/climb/log/predictions.py",
    "src/climb/schema/prediction.py",
]
tables = [
    "predictions",
]

[[element]]
id = "snapshot"
kind = "component"
container = "api"
name = "Snapshot"
role = "Serves the seeded content to both clients as one document, revalidated by its ETag."
doc = "api/snapshot.md"
src = ["src/climb/knowledge/snapshot.py"]

[[element]]
id = "knowledge-sync"
kind = "component"
container = "api"
name = "Knowledge sync"
role = "Stores a client's sync lines, refusing each line that names unknown content, and returns the user's records since a cursor."
doc = "api/knowledge-sync.md"
src = [
    "src/climb/knowledge/sync.py",
    "src/climb/knowledge/wire.py",
]

[[element]]
id = "knowledge-log"
kind = "component"
container = "api"
name = "Knowledge log"
role = "The nine append-only tables of the user's knowledge log: answers, stints, focuses and the rest."
doc = "api/knowledge-log.md"
src = [
    "src/climb/knowledge/schedule.py",
    "src/climb/schema/knowledge.py",
]
tables = [
    "answers", "certification_exams", "focuses", "lesson_marks", "limit_raises",
    "module_orders", "module_status_changes", "setting_changes", "stints",
]

[[element]]
id = "problems"
kind = "component"
container = "api"
name = "Problems"
role = "Reads a problem from the corpus: its statement, its templates and its test cases."
doc = "api/problems.md"
src = [
    "src/climb/problems/__init__.py",
    "src/climb/problems/store.py",
]

[[element]]
id = "card-runs"
kind = "component"
container = "api"
name = "Card runs"
