    "src/climb/diagnosing/**",
    "src/climb/mutant_diagnoses/**",
    "src/climb/judging/labelled.py",
    "src/climb/cli/diagnose.py",
    "src/climb/schema/diagnosis.py",
]
tables = [
    "diagnoses", "mutant_diagnoses",
]

[[element]]
id = "matcher"
kind = "component"
container = "cli"
name = "Matcher"
role = "Reads a canonical beside its statement and names the card templates it displays."
doc = "cli/matcher.md"
src = [
    "src/climb/matches/**",
    "src/climb/cli/match.py",
    "src/climb/cli/gaps.py",
    "src/climb/cli/hand_match.py",
    "src/climb/cli/hand_matching.py",
    "src/climb/schema/match.py",
]
tables = [
    "template_matches",
]

[[element]]
id = "exercise-items"
kind = "component"
container = "cli"
name = "Exercise items"
role = "Builds the judgement items and the key-line items from the seeded templates and their mutants."
doc = "cli/exercise-items.md"
src = [
    "src/climb/judgements/**",
    "src/climb/keylines/**",
    "src/climb/judging/build.py",
    "src/climb/judging/keylines.py",
    "src/climb/cli/fill.py",
    "src/climb/cli/judge.py",
    "src/climb/schema/judgement.py",
    "src/climb/schema/keyline.py",
]
tables = [
    "judgement_items", "key_line_choices", "key_line_items",
]

[[element]]
id = "calls"
kind = "component"
container = "cli"
name = "Calls"
role = "Sends every model call through one transport, each pinned to one endpoint, and appends it to the call log."
doc = "cli/calls.md"
src = [
    "src/climb/calls/**",
    "src/climb/runs.py",
    "src/climb/cli/transport.py",
    "src/climb/schema/call.py",
    "src/climb/schema/configuration.py",
    "src/climb/schema/provenance.py",
]
tables = [
    "calls",
]

