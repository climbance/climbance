# Flows

[[flow]]
id = "drill-loop"
name = "Drill loop"
doc = "flows/drill-loop.md"
steps = [
    { from = "learner", to = "web-app" },
    { from = "web-app", to = "submission" },
    { from = "submission", to = "run-faults" },
    { from = "submission", to = "sitting" },
    { from = "sitting", to = "database" },
    { from = "submission", to = "runner" },
    { from = "runner", to = "problems" },
    { from = "problems", to = "database" },
    { from = "runner", to = "broker" },
    { from = "broker", to = "sandbox" },
    { from = "submission", to = "attempt-log" },
    { from = "attempt-log", to = "database" },
    { from = "web-app", to = "attempt-claims" },
    { from = "attempt-claims", to = "database" },
    { from = "web-app", to = "self-labels" },
    { from = "self-labels", to = "database" },
    { from = "web-app", to = "pick" },
    { from = "pick", to = "template-schedule" },
    { from = "template-schedule", to = "attempt-log" },
    { from = "pick", to = "card-states" },
    { from = "card-states", to = "attempt-log" },
    { from = "pick", to = "mastery" },
    { from = "mastery", to = "attempt-log" },
    { from = "mastery", to = "attempt-claims" },
    { from = "mastery", to = "self-labels" },
    { from = "pick", to = "predictions" },
    { from = "predictions", to = "database" },
]

[[flow]]
id = "starting-a-card-run"
name = "Starting a card run"
doc = "flows/starting-a-card-run.md"
steps = [
    { from = "learner", to = "web-app" },
    { from = "web-app", to = "card-states" },
    { from = "web-app", to = "card-runs" },
    { from = "card-runs", to = "problems" },
    { from = "problems", to = "database" },
    { from = "card-runs", to = "attempt-log" },
    { from = "card-runs", to = "database" },
    { from = "card-states", to = "card-runs" },
]

[[flow]]
id = "solving-a-rung"
name = "Solving a rung"
doc = "flows/solving-a-rung.md"
steps = [
    { from = "learner", to = "web-app" },
    { from = "web-app", to = "card-states" },
    { from = "card-states", to = "attempt-log" },
    { from = "card-states", to = "sitting" },
    { from = "web-app", to = "submission" },
    { from = "submission", to = "sitting" },
    { from = "submission", to = "runner" },
    { from = "runner", to = "broker" },
    { from = "broker", to = "sandbox" },
    { from = "submission", to = "attempt-log" },
    { from = "web-app", to = "attempt-claims" },
    { from = "web-app", to = "self-labels" },
]

[[flow]]
id = "recalling-a-template"
name = "Recalling a template"
doc = "flows/recalling-a-template.md"
steps = [
    { from = "learner", to = "web-app" },
    { from = "web-app", to = "recall" },
    { from = "recall", to = "runner" },
    { from = "runner", to = "broker" },
