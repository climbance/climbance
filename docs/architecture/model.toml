doc = "api/card-runs.md"
src = [
    "src/climb/log/runs.py",
    "src/climb/schema/card_run.py",
]
tables = [
    "card_run_probes", "card_runs",
]

[[element]]
id = "recall"
kind = "component"
container = "api"
name = "Recall"
role = "Runs a template typed from memory against the template's cases, and stores the recall attempt."
doc = "api/recall.md"
src = [
    "src/climb/recall.py",
    "src/climb/log/recalls.py",
    "src/climb/schema/recall.py",
]
tables = [
    "recall_attempt_case_results", "recall_attempts",
]

[[element]]
id = "short-exercises"
kind = "component"
container = "api"
name = "Short exercises"
role = "Serves the judgement and key-line items, and stores each judgement and fill."
doc = "api/short-exercises.md"
src = [
    "src/climb/api/filling.py",
    "src/climb/api/judging.py",
    "src/climb/judging/__init__.py",
    "src/climb/judging/answer.py",
    "src/climb/log/fills.py",
    "src/climb/log/judgements.py",
]
tables = [
    "fills", "judgements",
]

[[element]]
id = "retirement-requests"
kind = "component"
container = "api"
name = "Retirement requests"
role = "Stores a user's request that a problem be retired, for the author to read."
doc = "api/retirement-requests.md"
src = [
    "src/climb/retirement.py",
    "src/climb/log/retirement_requests.py",
    "src/climb/schema/retirement_request.py",
]
tables = [
    "retirement_requests",
]

[[element]]
id = "feedback"
kind = "component"
container = "api"
name = "Feedback"
role = "Stores a user's note to the author, naming the client and the page."
doc = "api/feedback.md"
src = [
    "src/climb/feedback.py",
    "src/climb/api/feedback.py",
    "src/climb/log/feedback.py",
    "src/climb/cli/feedback.py",
    "src/climb/schema/feedback.py",
]
tables = [
    "feedback",
]

[[element]]
id = "sign-in"
kind = "component"
