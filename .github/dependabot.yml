version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # minor and patch in one PR; a major stays its own, so one breaking bump
  # cannot hold back the rest
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        update-types: [minor, patch]
  # the root: the workspace's one lock file is there, and a bump from /web
  # leaves it stale, so `npm ci` refuses it
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    # the Expo SDK pins these in expo/bundledNativeModules.json, and the root
    # override holds web's React to native's; `npx expo install --fix` moves them
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-keyboard-controller
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-webview
      - dependency-name: react-native-worklets
  # the sandbox image is pinned by digest in broker/container.py and stays
  # out of reach on purpose: moving it re-times every canonical
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # a new minor moves `requires-python`, so it is taken by hand, and its
      # alphas are skipped with it
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # a major moves the data directory's format, which a tag bump cannot
      - dependency-name: postgres
        update-types: [version-update:semver-major]
