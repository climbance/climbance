# Known vulnerabilities in what is installed. Weekly, since a new advisory
# arrives without a commit.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - run: uv run --with pip-audit pip-audit
      # the workspace's packages, read from the lockfile alone. A low advisory
      # passes: the one left sits in shadcn's CLI, which no page ships
      - run: npm audit --audit-level=moderate
